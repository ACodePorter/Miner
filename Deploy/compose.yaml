services:
  mongodb:
    # build: ./mongodb
    image: mongo:8.0.5
    restart: unless-stopped
    container_name: miner-mongodb
    hostname: miner-mongodb
    volumes:
      - '${HOME}/.miner/mongogo:/data/db'
    ports:
      - '27017:27017'
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
    #   - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

#   mongo-express:
#     image: mongo-express
#     restart: always
#     ports:
#       - 8081:8081
#     environment:
#       # ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
#       # ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
#       ME_CONFIG_MONGODB_URL: mongodb://miner-mongodb:27017/
#       ME_CONFIG_BASICAUTH: false

  redis:
    build: ./redis
    restart: unless-stopped
    hostname: miner-redis
    container_name: miner-redis
    ports:
      - '6379:6379'

  rabbitmq:
    build: ./rabbitmq
    restart: unless-stopped
    container_name: miner-rabbitmq
    hostname: miner-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'

  browserscraper:
    build: ./browserscraper
    restart: unless-stopped
    container_name: miner-browserscraper
    hostname: miner-browserscraper
    depends_on:
      - redis
      - rabbitmq
      - mongodb
    ports:
      - '8002:8002'
    environment:
      - RUNTIME_ENV=${RUNTIME_ENV}
    volumes:
      - '${MINER_DATA}:/data/miner'
      - '${PWD}/../:/minerdev'

  maintainer:
    build:
      context: ./maintainer
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        GIT_USER_NAME: ${GIT_USER_NAME}
        GIT_USER_EMAIL: ${GIT_USER_EMAIL}
    restart: unless-stopped
    container_name: miner-maintainer
    hostname: miner-maintainer
    depends_on:
      - redis
      - rabbitmq
      - mongodb
    environment:
      - RUNTIME_ENV=${RUNTIME_ENV}
    volumes:
      - '${MINER_DATA}:/data/miner'
      - '${PWD}/../:/minerdev'

  miner:
    build: ./miner
    restart: always
    container_name: minerservice
    hostname: miner-service
    depends_on:
      - redis
      - rabbitmq
      - mongodb
#       - mongo-express
    ports:
      - '80:80'
      - '2222:2222'
      - '6666:6666'
      - '8001:8001'
    environment:
      - RUNTIME_ENV=${RUNTIME_ENV}
    privileged: true
    volumes:
      - '/dev/bus/usb:/dev/bus/usb'
      - '${MINER_DATA}:/data/miner'
      - '${PWD}/../:/minerdev'
  
